<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neo Croissant · Dynamic 预览</title></head><body><main><header><p class="eyebrow">NEO CROISSANT · CHESS.COM 风格还原包</p><h1>抓取、走棋、吃子，都能试。</h1><p>已按原版代码补齐常规走棋特效。可手动下棋，或选择局面播放。</p><p class="notice">独立预览：不连接账户，不改动 En Croissant 的对局。</p></header><section class="layout"><div id="board" aria-label="动画测试棋盘"></div><aside><label for="scene">测试局面</label><select id="scene"><option value="opening">正常走棋</option><option value="capture">吃子</option><option value="castle">王车易位</option><option value="ep">吃过路兵</option><option value="promote">升变</option><option value="check">将军与解除</option></select><label for="mode">动画</label><select id="mode"><option value="candidate">Dynamic 适配版</option><option value="plain">基础动画（对照）</option></select><label for="promotion">兵升变为</label><select id="promotion"><option value="queen">后</option><option value="rook">车</option><option value="bishop">象</option><option value="knight">马</option></select><div class="buttons"><button id="replay">播放当前局面</button><button id="reset">重置当前局面</button><button id="flip">翻转棋盘</button><button id="size">切换棋盘大小</button></div><p id="status" role="status">正常走棋：白方走棋</p><details><summary>适配与核对范围</summary><p>抓取缩放、拖动摆动、自动走棋旋转与渐变拖尾、吃子放大淡出、落点涟漪、将军提醒、升变和非法落点反馈。王车易位、吃过路兵及四种升变均按真实棋局触发。</p><p>依据官网棋盘 1.187.1 的动画公式与 CSS。互动娱乐彩蛋不属于本页常规走棋范围；没有宣称逐像素完全一致。</p><p id="position-check">等待拖动测试</p></details></aside></section></main><script type="module" src="./main.ts"></script></body></html>
