name: Verify restoration kit
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/prepare.py
      - run: pnpm install --frozen-lockfile
        working-directory: .build/upstream
      - run: pnpm exec tsgo --noEmit
        working-directory: .build/upstream
      - run: pnpm exec vitest run src/chessground/animation.test.ts src/chessground/appMotion.test.ts tests/dynamicMotion.test.ts tests/computerGame.test.ts tests/computerGameFlow.test.tsx tests/gameHint.test.ts tests/useGameHint.test.tsx
        working-directory: .build/upstream
      - run: node .build/upstream/node_modules/vitest/vitest.mjs run --config preview/test.config.mjs
      - run: node .build/upstream/node_modules/vite/bin/vite.js build --config preview/vite.config.mjs
      - run: pip install python-chess==1.999
      - run: python scripts/validate_training.py
  installer:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -v
